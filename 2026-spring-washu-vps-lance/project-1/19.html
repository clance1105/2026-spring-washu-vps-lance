  <style>
body{
  background:#000;
  font-family:"Comic Neue", sans-serif;
  margin:0;
  color:#fff;
}

.menu{
  max-width:520px;
  margin:0 auto 60px;
  padding:0 18px;
  box-sizing:border-box;
  position:relative;
}

/* HERO */
.skylodge{
  width:100%;
  height:420px;
  object-fit:cover;
  border-radius:0 0 18px 18px;
  opacity:.88;
}

/* Title floats on top of the hero */
h3{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  font-family:"Lobster", cursive;
  font-size:58px;
  letter-spacing:0.55em;
  margin:0;
  padding:10px 18px;
  border:1px solid rgba(255,255,255,0.30);
  border-radius:999px;
  background:rgba(0,0,0,0.35);
  box-sizing:border-box;
  text-align:center;
}

h2{
  text-align:center;
  font-size:13px;
  margin:14px 0;
  letter-spacing:0.22em;
  opacity:.9;
}

/* Start content in a “card” that tucks into the hero */
h1, ul, .inline-img{
  position:relative;
  top:-38px;
}

h1{
  font-family:"Lobster", cursive;
  font-size:30px;
  text-align:center;
  letter-spacing:0.6em;
  margin:26px 0 12px;
  padding:14px 10px;
  border:1px solid rgba(255,255,255,0.18);
  border-radius:14px;
  background:rgba(0,0,0,0.55);
}

ul{ list-style:none; padding:0; margin:0; }

li{
  display:flex;
  justify-content:space-between;
  padding:12px 12px;
  margin:8px 0;
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  box-sizing:border-box;
  letter-spacing:0.05em;
}

.inline-img{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:14px;
  margin:22px 0 10px;
  opacity:.9;
}

li span:last-child{ font-weight:700; }

a{ color:#fff; text-decoration:none; }
a:hover{ text-decoration:underline; }

  </style>
</head>
